version: "3"

tasks:
  # =============================================================================
  # ヘルプ
  # =============================================================================
  # 引数なしで `task` を実行したときに、カスタム順のリストを表示する
  default:
    silent: true
    cmds:
      - task --list-all --sort none
  # =============================================================================
  # 初期化 — 開発環境セットアップ
  # =============================================================================
  init:
    desc: 開発環境をセットアップ
    cmds:
      - git config --local commit.template .commit-template
      - mise trust .mise.toml
      - mise install
      # - pipx install pre-commit
      # - pre-commit install
  # =============================================================================
  # AWS draw.io ライブラリ
  # =============================================================================
  drawio:build:
    desc: AWSアイコンZIPからdraw.io SVGライブラリを生成（ICON_PACKAGEを指定）
    requires:
      vars: [ICON_PACKAGE]
    cmds:
      - mise exec -- python3 skills/aws-drawio-import/scripts/build_aws_drawio_libraries.py "{{.ICON_PACKAGE}}" --output-dir build/drawio_libs
